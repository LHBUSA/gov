<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-label="County modernization operating model">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a33"/><stop offset="1" stop-color="#164c9f"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef3340"/><stop offset="1" stop-color="#a90f22"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#dfe9f5" stroke-width="1"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/><feOffset in="blur" dx="0" dy="12" result="offsetBlur"/><feFlood flood-color="#071a33" flood-opacity="0.12" result="shadowColor"/><feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef3340"/></marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c6ee8"/></marker>
</defs>
<style>
  .sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
  .ink{fill:#071a33}.text{fill:#38536f}.muted{fill:#71849a}.blue{fill:#1f5dd8}.red{fill:#c81e2b}.white{fill:#fff}
  .eyebrow{font:800 14px Consolas,monospace;letter-spacing:3px}.title{font:500 60px Georgia,serif}.h2{font:500 34px Georgia,serif}.h3{font:700 23px Inter,Arial,sans-serif}.body{font:400 16px Inter,Arial,sans-serif}.small{font:600 13px Inter,Arial,sans-serif}.tiny{font:700 11px Consolas,monospace;letter-spacing:1.3px}
</style>
<rect width="1672" height="941" fill="url(#bg)"/><rect width="1672" height="941" fill="url(#grid)" opacity=".65"/><circle cx="836" cy="470" r="390" fill="#1f5dd8" opacity=".035"/><circle cx="836" cy="470" r="310" fill="none" stroke="#1f5dd8" opacity=".08" stroke-width="2"/><text x="836" y="75" text-anchor="middle" class="eyebrow blue">PROPTECHUSA.GOV • COUNTY-CONTROLLED MODERNIZATION</text><text x="836" y="155" text-anchor="middle" class="title ink">The County Modernization <tspan fill="#c81e2b">Operating Model</tspan></text><text x="836" y="198" text-anchor="middle" class="body text">A proven partnership framework that turns policy into governed digital services.</text><g filter="url(#shadow)"><rect x="70" y="245" width="332" height="518" rx="22" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><circle cx="112" cy="285" r="26" fill="#071a33"/><text x="112" y="294" text-anchor="middle" class="h3 white">1</text><text x="236" y="363" text-anchor="middle" class="h3 ink" style="font-family:Georgia,serif;font-size:27px;font-weight:500">Define the Service</text><rect x="215" y="398" width="42" height="3" fill="#ef3340"/><text x="100" y="432" class="small text">Align policy, scope, permissions,</text><text x="100" y="455" class="small text">and clear data standards.</text><rect x="94" y="486" width="284" height="242" rx="16" fill="#f7faff" stroke="#d4e0ec"/><circle cx="116" cy="521" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M111 521 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="138" y="526" class="small text" style="font-size:12px">County policy &amp; service rules</text><circle cx="116" cy="570" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M111 570 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="138" y="575" class="small text" style="font-size:12px">Data standards &amp; classifications</text><circle cx="116" cy="619" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M111 619 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="138" y="624" class="small text" style="font-size:12px">Permissions &amp; access model</text><circle cx="116" cy="668" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M111 668 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="138" y="673" class="small text" style="font-size:12px">Value, SLAs &amp; success metrics</text></g><path d="M404 512 H462" stroke="#ef3340" stroke-width="3" marker-end="url(#arrowRed)"/><g filter="url(#shadow)"><rect x="470" y="245" width="332" height="518" rx="22" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><circle cx="512" cy="285" r="26" fill="#071a33"/><text x="512" y="294" text-anchor="middle" class="h3 white">2</text><text x="636" y="344" text-anchor="middle" class="h3 ink" style="font-family:Georgia,serif;font-size:27px;font-weight:500">Connect Official</text><text x="636" y="378" text-anchor="middle" class="h3 ink" style="font-family:Georgia,serif;font-size:27px;font-weight:500">Systems</text><rect x="615" y="398" width="42" height="3" fill="#ef3340"/><text x="500" y="432" class="small text">Connect assessor, GIS, tax,</text><text x="500" y="455" class="small text">permits, and records securely.</text><rect x="494" y="486" width="284" height="242" rx="16" fill="#f7faff" stroke="#d4e0ec"/><circle cx="516" cy="521" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M511 521 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="538" y="526" class="small text" style="font-size:12px">Source validation &amp; reconciliation</text><circle cx="516" cy="570" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M511 570 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="538" y="575" class="small text" style="font-size:12px">Entity resolution &amp; crosswalks</text><circle cx="516" cy="619" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M511 619 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="538" y="624" class="small text" style="font-size:12px">Provenance &amp; audit trails</text><circle cx="516" cy="668" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M511 668 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="538" y="673" class="small text" style="font-size:12px">Documentation &amp; data dictionary</text></g><path d="M804 512 H862" stroke="#ef3340" stroke-width="3" marker-end="url(#arrowRed)"/><g filter="url(#shadow)"><rect x="870" y="245" width="332" height="518" rx="22" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><circle cx="912" cy="285" r="26" fill="#071a33"/><text x="912" y="294" text-anchor="middle" class="h3 white">3</text><text x="1036" y="344" text-anchor="middle" class="h3 ink" style="font-family:Georgia,serif;font-size:27px;font-weight:500">Launch Governed</text><text x="1036" y="378" text-anchor="middle" class="h3 ink" style="font-family:Georgia,serif;font-size:27px;font-weight:500">Delivery</text><rect x="1015" y="398" width="42" height="3" fill="#ef3340"/><text x="900" y="432" class="small text">Launch the official API and portal</text><text x="900" y="455" class="small text">with governed controls.</text><rect x="894" y="486" width="284" height="242" rx="16" fill="#f7faff" stroke="#d4e0ec"/><circle cx="916" cy="521" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M911 521 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="938" y="526" class="small text" style="font-size:12px">API + portal launch</text><circle cx="916" cy="570" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M911 570 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="938" y="575" class="small text" style="font-size:12px">Governance &amp; access</text><circle cx="916" cy="619" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M911 619 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="938" y="624" class="small text" style="font-size:12px">Developer documentation</text><circle cx="916" cy="668" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M911 668 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="938" y="673" class="small text" style="font-size:12px">Compliance by design</text></g><path d="M1204 512 H1262" stroke="#ef3340" stroke-width="3" marker-end="url(#arrowRed)"/><g filter="url(#shadow)"><rect x="1270" y="245" width="332" height="518" rx="22" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><circle cx="1312" cy="285" r="26" fill="#071a33"/><text x="1312" y="294" text-anchor="middle" class="h3 white">4</text><text x="1436" y="344" text-anchor="middle" class="h3 ink" style="font-family:Georgia,serif;font-size:27px;font-weight:500">Operate and</text><text x="1436" y="378" text-anchor="middle" class="h3 ink" style="font-family:Georgia,serif;font-size:27px;font-weight:500">Improve</text><rect x="1415" y="398" width="42" height="3" fill="#ef3340"/><text x="1300" y="432" class="small text">Monitor performance, support,</text><text x="1300" y="455" class="small text">and continuously improve.</text><rect x="1294" y="486" width="284" height="242" rx="16" fill="#f7faff" stroke="#d4e0ec"/><circle cx="1316" cy="521" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M1311 521 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="1338" y="526" class="small text" style="font-size:12px">Refresh &amp; monitoring</text><circle cx="1316" cy="570" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M1311 570 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="1338" y="575" class="small text" style="font-size:12px">Support &amp; incident response</text><circle cx="1316" cy="619" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M1311 619 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="1338" y="624" class="small text" style="font-size:12px">Usage analytics &amp; SLAs</text><circle cx="1316" cy="668" r="9" fill="none" stroke="#2c6ee8" stroke-width="2"/><path d="M1311 668 l4 4 7-9" fill="none" stroke="#2c6ee8" stroke-width="2"/><text x="1338" y="673" class="small text" style="font-size:12px">Continuous improvement</text></g><rect x="132" y="814" width="1408" height="78" rx="18" fill="#fff" stroke="#ccd9e8"/><text x="250" y="850" class="tiny blue">COUNTY CONTROL</text><text x="250" y="873" class="small text">You own your data.</text><text x="600" y="850" class="tiny blue">BUILT FOR GOVERNMENT</text><text x="600" y="873" class="small text">Secure, compliant, public-service aligned.</text><text x="1060" y="850" class="tiny blue">SOURCE OF RECORD FIRST</text><text x="1060" y="873" class="small text">Validated data. Clear provenance.</text></svg>