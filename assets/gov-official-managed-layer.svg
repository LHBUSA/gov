</g><text x="836" y="289" text-anchor="middle" class="eyebrow red">PROPTECHUSA.GOV</text><text x="836" y="352" text-anchor="middle" class="title white">Official Managed</text><text x="836" y="411" text-anchor="middle" class="title white">Data Layer</text><text x="836" y="449" text-anchor="middle" class="body" fill="#b9cdeb">Normalize. Govern. Document. Operate.</text><rect x="610" y="490" width="208" height="74" rx="14" fill="#ffffff" opacity=".07" stroke="#aac5ef" stroke-opacity=".36"/><circle cx="639" cy="527" r="12" fill="none" stroke="#85b7ff" stroke-width="2"/><text x="664" y="521" class="small white">Identity +</text><text x="664" y="541" class="small white">Crosswalks</text><rect x="846" y="490" width="208" height="74" rx="14" fill="#ffffff" opacity=".07" stroke="#aac5ef" stroke-opacity=".36"/><circle cx="875" cy="527" r="12" fill="none" stroke="#85b7ff" stroke-width="2"/><text x="900" y="521" class="small white">Provenance +</text><text x="900" y="541" class="small white">Rights</text><rect x="610" y="585" width="208" height="74" rx="14" fill="#ffffff" opacity=".07" stroke="#aac5ef" stroke-opacity=".36"/><circle cx="639" cy="622" r="12" fill="none" stroke="#85b7ff" stroke-width="2"/><text x="664" y="616" class="small white">Refresh +</text><text x="664" y="636" class="small white">Monitoring</text><rect x="846" y="585" width="208" height="74" rx="14" fill="#ffffff" opacity=".07" stroke="#aac5ef" stroke-opacity=".36"/><circle cx="875" cy="622" r="12" fill="none" stroke="#85b7ff" stroke-width="2"/><text x="900" y="616" class="small white">Access +</text><text x="900" y="636" class="small white">Billing</text><line x1="590" y1="683" x2="1082" y2="683" stroke="#fff" opacity=".15"/><text x="836" y="716" text-anchor="middle" class="tiny" fill="#b5c9e7">SECURE BY DESIGN · AUDITABLE BY DEFAULT · BUILT FOR TRUST</text></g><rect x="316" y="802" width="1040" height="86" rx="20" fill="#fff" stroke="#ccd9e8"/><g class="small text"><text x="375" y="840" class="tiny blue">GOVERNED DATA</text><text x="375" y="864">Trusted and policy-aligned.</text><text x="665" y="840" class="tiny blue">COUNTY CONTROL</text><text x="665" y="864">You own the data. We power the layer.</text><text x="1015" y="840" class="tiny blue">BUILT FOR SCALE</text><text x="1015" y="864">Modern infrastructure for public service.</text></g></svg>