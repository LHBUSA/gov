<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img" aria-label="Official managed county data layer architecture">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071a33"/><stop offset="1" stop-color="#164c9f"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef3340"/><stop offset="1" stop-color="#a90f22"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#dfe9f5" stroke-width="1"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/><feOffset in="blur" dx="0" dy="12" result="offsetBlur"/><feFlood flood-color="#071a33" flood-opacity="0.12" result="shadowColor"/><feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
  <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ef3340"/></marker>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2c6ee8"/></marker>
</defs>
<style>
  .sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
  .ink{fill:#071a33}.text{fill:#38536f}.muted{fill:#71849a}.blue{fill:#1f5dd8}.red{fill:#c81e2b}.white{fill:#fff}
  .eyebrow{font:800 14px Consolas,monospace;letter-spacing:3px}.title{font:500 60px Georgia,serif}.h2{font:500 34px Georgia,serif}.h3{font:700 23px Inter,Arial,sans-serif}.body{font:400 16px Inter,Arial,sans-serif}.small{font:600 13px Inter,Arial,sans-serif}.tiny{font:700 11px Consolas,monospace;letter-spacing:1.3px}
</style>
<rect width="1672" height="941" fill="url(#bg)"/><rect width="1672" height="941" fill="url(#grid)" opacity=".65"/><circle cx="836" cy="470" r="390" fill="#1f5dd8" opacity=".035"/><circle cx="836" cy="470" r="310" fill="none" stroke="#1f5dd8" opacity=".08" stroke-width="2"/><text x="86" y="82" class="eyebrow ink">COUNTY SYSTEMS OF RECORD</text><text x="1220" y="82" class="eyebrow ink">APPROVED DELIVERY CHANNELS</text><g filter="url(#shadow)"><rect x="70" y="125" width="380" height="126" rx="20" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><text x="98" y="173" class="h3 ink">Assessor / CAMA</text><rect x="98" y="190" width="42" height="3" rx="2" fill="#ef3340"/><text x="98" y="219" class="body text">Property, ownership, values, classifications.</text></g><circle cx="448" cy="188" r="7" fill="#ef3340"/><path d="M455 188 H535" stroke="#ef3340" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/><g filter="url(#shadow)"><rect x="70" y="280" width="380" height="126" rx="20" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><text x="98" y="328" class="h3 ink">GIS / Parcels</text><rect x="98" y="345" width="42" height="3" rx="2" fill="#ef3340"/><text x="98" y="374" class="body text">Boundaries, geometry, and spatial layers.</text></g><circle cx="448" cy="343" r="7" fill="#ef3340"/><path d="M455 343 H535" stroke="#ef3340" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/><g filter="url(#shadow)"><rect x="70" y="435" width="380" height="126" rx="20" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><text x="98" y="483" class="h3 ink">Tax / Finance</text><rect x="98" y="500" width="42" height="3" rx="2" fill="#ef3340"/><text x="98" y="529" class="body text">Levies, balances, payments, and status.</text></g><circle cx="448" cy="498" r="7" fill="#ef3340"/><path d="M455 498 H535" stroke="#ef3340" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/><g filter="url(#shadow)"><rect x="70" y="590" width="380" height="126" rx="20" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><text x="98" y="638" class="h3 ink">Permits / Records</text><rect x="98" y="655" width="42" height="3" rx="2" fill="#ef3340"/><text x="98" y="684" class="body text">Applications, inspections, and cases.</text></g><circle cx="448" cy="653" r="7" fill="#ef3340"/><path d="M455 653 H535" stroke="#ef3340" stroke-width="3" fill="none" marker-end="url(#arrowRed)"/><g filter="url(#shadow)"><rect x="1222" y="125" width="380" height="126" rx="20" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><text x="1250" y="173" class="h3 ink">Official API</text><rect x="1250" y="190" width="42" height="3" rx="2" fill="#1f5dd8"/><text x="1250" y="219" class="body text">Secure access for approved integrations.</text></g><path d="M1136 188 H1214" stroke="#2c6ee8" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/><circle cx="1222" cy="188" r="7" fill="#2c6ee8"/><g filter="url(#shadow)"><rect x="1222" y="280" width="380" height="126" rx="20" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><text x="1250" y="328" class="h3 ink">County Portal</text><rect x="1250" y="345" width="42" height="3" rx="2" fill="#1f5dd8"/><text x="1250" y="374" class="body text">Unified access for staff and partners.</text></g><path d="M1136 343 H1214" stroke="#2c6ee8" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/><circle cx="1222" cy="343" r="7" fill="#2c6ee8"/><g filter="url(#shadow)"><rect x="1222" y="435" width="380" height="126" rx="20" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><text x="1250" y="483" class="h3 ink">Bulk Exports</text><rect x="1250" y="500" width="42" height="3" rx="2" fill="#1f5dd8"/><text x="1250" y="529" class="body text">Scheduled extracts for authorized use.</text></g><path d="M1136 498 H1214" stroke="#2c6ee8" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/><circle cx="1222" cy="498" r="7" fill="#2c6ee8"/><g filter="url(#shadow)"><rect x="1222" y="590" width="380" height="126" rx="20" fill="#fff" stroke="#cbd9e8" stroke-width="1.5"/><text x="1250" y="638" class="h3 ink">Approved AI Access</text><rect x="1250" y="655" width="42" height="3" rx="2" fill="#1f5dd8"/><text x="1250" y="684" class="body text">Governed access for AI and analytics.</text></g><path d="M1136 653 H1214" stroke="#2c6ee8" stroke-width="3" fill="none" marker-end="url(#arrowBlue)"/><circle cx="1222" cy="653" r="7" fill="#2c6ee8"/><g filter="url(#shadow)"><rect x="558" y="123" width="556" height="624" rx="30" fill="url(#navy)" stroke="#7aa8ef" stroke-width="2"/>
