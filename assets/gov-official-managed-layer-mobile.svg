<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">PropTechUSA Gov mobile county data architecture</title>
<desc id="desc">County assessor, GIS, tax and permit systems flow into the PropTechUSA Gov managed data layer, then out to approved API, portal, bulk and AI delivery channels.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2f60"/><stop offset="1" stop-color="#071a33"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1f5dd8" stroke-opacity=".045"/></pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#071a33" flood-opacity=".13"/></filter>
</defs>
<rect width="900" height="620" rx="34" fill="url(#bg)"/>
<rect width="900" height="620" rx="34" fill="url(#grid)"/>

<text x="450" y="56" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#38536f">COUNTY SYSTEMS</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#0b1f3a" text-anchor="middle">
  <g transform="translate(54 82)" filter="url(#shadow)"><rect width="184" height="68" rx="18" fill="#fff" stroke="#cbd9e7"/><text x="92" y="43">Assessor</text></g>
  <g transform="translate(257 82)" filter="url(#shadow)"><rect width="184" height="68" rx="18" fill="#fff" stroke="#cbd9e7"/><text x="92" y="43">GIS</text></g>
  <g transform="translate(460 82)" filter="url(#shadow)"><rect width="184" height="68" rx="18" fill="#fff" stroke="#cbd9e7"/><text x="92" y="43">Tax</text></g>
  <g transform="translate(663 82)" filter="url(#shadow)"><rect width="184" height="68" rx="18" fill="#fff" stroke="#cbd9e7"/><text x="92" y="43">Permits</text></g>
</g>

<path d="M450 168v44" stroke="#d32336" stroke-width="7" stroke-linecap="round"/>
<path d="M435 199l15 16 15-16" fill="none" stroke="#d32336" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

<g transform="translate(110 228)" filter="url(#shadow)">
  <rect width="680" height="180" rx="30" fill="url(#core)" stroke="#214d86" stroke-width="2"/>
  <g transform="translate(54 42)">
    <path d="M52 0 97 16v33c0 40-18 67-45 82C25 116 7 89 7 49V16z" fill="#1f5dd8" stroke="#8ebcff" stroke-width="3"/>
    <rect x="30" y="65" width="10" height="28" rx="2" fill="#ef3340"/><rect x="47" y="50" width="10" height="43" rx="2" fill="#fff"/><rect x="64" y="31" width="10" height="62" rx="2" fill="#8fc0ff"/>
  </g>
  <text x="360" y="70" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" letter-spacing="2" fill="#9fc1f4">PROPTECHUSA GOV</text>
  <text x="360" y="116" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="43" fill="#fff">Managed Data Layer</text>
  <text x="360" y="151" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#c4d4e8">Normalize · Govern · Deliver</text>
</g>

<path d="M450 424v44" stroke="#1f5dd8" stroke-width="7" stroke-linecap="round"/>
<path d="M435 455l15 16 15-16" fill="none" stroke="#1f5dd8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

<text x="450" y="503" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" letter-spacing="3" fill="#38536f">APPROVED DELIVERY</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#0b1f3a" text-anchor="middle">
  <g transform="translate(54 526)" filter="url(#shadow)"><rect width="184" height="68" rx="18" fill="#fff" stroke="#cbd9e7"/><text x="92" y="43">API</text></g>
  <g transform="translate(257 526)" filter="url(#shadow)"><rect width="184" height="68" rx="18" fill="#fff" stroke="#cbd9e7"/><text x="92" y="43">Portal</text></g>
  <g transform="translate(460 526)" filter="url(#shadow)"><rect width="184" height="68" rx="18" fill="#fff" stroke="#cbd9e7"/><text x="92" y="43">Bulk</text></g>
  <g transform="translate(663 526)" filter="url(#shadow)"><rect width="184" height="68" rx="18" fill="#fff" stroke="#cbd9e7"/><text x="92" y="43">AI</text></g>
</g>
</svg>