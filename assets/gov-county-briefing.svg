1020" y="313" class="h3 ink">County Discovery Call</text><text x="1020" y="341" class="body text">Priorities, systems, and modernization goals.</text><rect x="925" y="393" width="610" height="94" rx="16" fill="#fbfdff" stroke="#d0deeb"/><rect x="945" y="417" width="44" height="44" rx="11" fill="#edf4fc"/><text x="967" y="446" text-anchor="middle" class="small blue">02</text><text x="1020" y="431" class="h3 ink">Systems Review</text><text x="1020" y="459" class="body text">Assessor, GIS, tax, permits, and records.</text><rect x="925" y="511" width="610" height="94" rx="16" fill="#fbfdff" stroke="#d0deeb"/><rect x="945" y="535" width="44" height="44" rx="11" fill="#edf4fc"/><text x="967" y="564" text-anchor="middle" class="small blue">03</text><text x="1020" y="549" class="h3 ink">Governance &amp; Delivery</text><text x="1020" y="577" class="body text">Ownership, security, access, and delivery.</text><rect x="925" y="629" width="610" height="94" rx="16" fill="#fbfdff" stroke="#d0deeb"/><rect x="945" y="653" width="44" height="44" rx="11" fill="#edf4fc"/><text x="967" y="682" text-anchor="middle" class="small blue">04</text><text x="1020" y="667" class="h3 ink">Pilot Planning</text><text x="1020" y="695" class="body text">Scope, success metrics, timeline, next steps.</text><rect x="900" y="755" width="660" height="112" rx="22" fill="url(#navy)"/><text x="950" y="799" class="eyebrow red">PROPTECHUSA.GOV</text><text x="950" y="840" class="h3 white" style="font-family:Georgia,serif;font-size:27px;font-weight:500">Normalize. Govern. Document. Operate.</text></g><rect x="88" y="792" width="665" height="90" rx="18" fill="#fff" stroke="#ccd9e8"/><text x="120" y="828" class="tiny blue">COUNTY-FOCUSED</text><text x="120" y="853" class="small text">Designed for administrators and staff.</text><text x="420" y="828" class="tiny blue">PROCUREMENT-AWARE</text><text x="420" y="853" class="small text">Aligned to public buying and compliance.</text></svg>