name: Enable Gov trust badges

on:
  push:
    paths:
      - .github/workflows/enable-trust-badges.yml

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wire trust badges into Gov footer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='  <script src="/trust-badges.js" defer></script>\n'
          if tag not in s:
              anchor='  <script>\n    (function () {'
              if anchor not in s:
                  raise SystemExit('Gov inline script anchor not found')
              s=s.replace(anchor,tag+anchor,1)
          if '/trust-badges.js' not in s:
              raise SystemExit('Trust badge loader missing after patch')
          p.write_text(s)
          PY
          node --check trust-badges.js
          grep -q 'trust-badges.js' index.html
      - name: Commit rollout
        shell: bash
        run: |
          git config user.name "PropTechUSA Build Bot"
          git config user.email "buildbot@proptechusa.ai"
          git rm .github/workflows/enable-trust-badges.yml
          git add index.html trust-badges.js
          git diff --cached --check
          git commit -m "Add Mother AI and PropData badges to Gov"
          git push origin HEAD:main
